name: Tests

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  headless-suite:
    name: Headless suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import assets
        run: '"$GODOT_BIN" --headless --path . --import'

      # tests/test_runner.gd exits 0 only when every check passes.
      - name: Run the headless suite
        run: '"$GODOT_BIN" --headless --path . res://tests/test_runner.tscn'
